version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: yuusal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yuusal
      POSTGRES_PASSWORD: yuusal_dev_pw
      POSTGRES_DB: yuusal
    ports:
      - "5432:5432"
    volumes:
      - yuusal_pgdata:/var/lib/postgresql/data

volumes:
  yuusal_pgdata:
